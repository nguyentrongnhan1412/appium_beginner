name: Android UI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android-tests:
    runs-on: ubuntu-latest
    environment: QA
    timeout-minutes: 45

    env:
      TEST_ACCOUNT_USERNAME: ${{ secrets.TEST_ACCOUNT_USERNAME }}
      TEST_ACCOUNT_PASSWORD: ${{ secrets.TEST_ACCOUNT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify account secrets
        run: |
          if [ -z "$TEST_ACCOUNT_USERNAME" ] || [ -z "$TEST_ACCOUNT_PASSWORD" ]; then
            echo "Set QA environment secrets TEST_ACCOUNT_USERNAME and TEST_ACCOUNT_PASSWORD."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Appium
        run: |
          npm ci
          npx appium --version
          npx appium driver list --installed

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download My Demo App APK
        run: |
          mkdir -p apps
          curl -L -o apps/mda.apk \
            "https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk"

      - name: Make scripts executable
        run: chmod +x gradlew .github/scripts/run-android-tests.sh

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # -no-snapshot / -no-snapshot-save: avoid hang while saving default_boot on kill
          emulator-options: -no-snapshot -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-android-tests.sh

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            build/allure-results/
            build/reports/allure-report/
            appium.log
          if-no-files-found: warn
